{%extends './menu-home.html'%}
{%block title%} Registrarse{%endblock%}
{%block content%}

<script src="https://cdn.tailwindcss.com"></script>
<div class="container mx-auto mt-6 bg-white p-4 rounded-xl shadow-lg max-w-4xl">
    <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">Registro</h2>
    <form method="POST" class="grid grid-cols-1 sm:grid-cols-2 gap-6">

        <!-- Lado izquierdo -->
        <div>
            <label for="first_name" class="block text-sm font-medium text-gray-700 mb-2">Nombres:</label>
            <input type="text" name="first_name" id="first_name" required
                class="w-full p-1 border-2 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">

            <label for="last_name" class="block text-sm font-medium text-gray-700 mt-4 mb-2">Apellidos:</label>
            <input type="text" name="last_name" id="last_name" required
                class="w-full p-1 border-2 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">

            <label for="birth_date" class="block text-sm font-medium text-gray-700 mt-4 mb-2">Fecha de
                Nacimiento:</label>
            <input type="date" name="birth_date" id="birth_date" required
                class="w-full p-1 border-2 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">

            <label for="id_card" class="block text-sm font-medium text-gray-700 mt-4 mb-2">Carnet de
                Identidad:</label>
            <input type="text" name="id_card" id="id_card" required
                class="w-full p-1 border-2 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">

            <label for="email" class="block text-sm font-medium text-gray-700 mt-4 mb-2">Correo electrónico:</label>
            <input type="email" name="email" id="email" required
                class="w-full p-1 border-2 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">

            <label for="phone" class="block text-sm font-medium text-gray-700 mt-4 mb-2">Número de celular:</label>
            <input type="tel" name="phone" id="phone" required
                class="w-full p-1 border-2 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
        </div>

        <!-- Lado derecho -->
        <div>
            <label for="role" class="block text-sm font-medium text-gray-700 mb-2">ROL:</label>
            <p class="text-xs text-gray-500 mb-1">Por favor escoja el rol que desee para la cuenta</p>
            <select name="role" id="role" required
                class="w-full p-1 border-2 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                <option value="">Seleccione un rol</option>
                <option value="tutor">Tutor</option>
                <option value="administrator">Administrador</option>
                <option value="cashier">Cajero</option>
            </select>

            <label for="password" class="block text-sm font-medium text-gray-700 mt-4 mb-2">Contraseña:</label>
            <input type="password" name="password" id="password" required
                class="w-full p-1 border-2 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">

            <label for="confirm_password" class="block text-sm font-medium text-gray-700 mt-4 mb-2">Verificar
                Contraseña:</label>
            <input type="password" name="confirm_password" id="confirm_password" required
                class="w-full p-1 border-2 border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
        </div>

        <div class="col-span-2 flex justify-end gap-4">
            <button type="submit"
                class="bg-blue-600 text-white py-2 px-6 rounded-full hover:bg-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                Registrarse
            </button>
            <button type="button"
                class="bg-gray-600 text-white py-2 px-6 rounded-full hover:bg-gray-500 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-all">
                Cancelar
            </button>
        </div>
    </form>
</div>
{%endblock%}
