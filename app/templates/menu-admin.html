<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/menu-admin.css') }}">
    <title>{%block title%} {%endblock title%}</title>
</head>
<body>
    <script src="https://kit.fontawesome.com/a09bd82edd.js" crossorigin="anonymous"></script>
    <header>
        <div class="logo">
            <img src="{{url_for('static', filename='images/logo-sansi.png')}}" alt="">
            <h1 class="oh-sansi"><a href="{{url_for('home')}}">Oh<span style="color:rgb(191, 0, 0)">!</span> Sansi</a></h1>
        </div>
        <nav>
            <a href="{{url_for('adminareas')}}" class="{% if request.path == url_for('adminareas') %}active{% endif %}">Competencias</a>
            <a href="{{url_for('adminreportes')}}" class="{% if request.path == url_for('adminreportes') %}active{% endif %}">Reportes</a>
            <a href="{{url_for('admincompetencia')}}" class="{% if request.path == url_for('admincompetencia') %}active{% endif %}">Olimpiada</a>
            <a href="" id="admin">Admin</a>
            <i class="fa-solid fa-circle-user"></i>
        </nav>
    </header>
    {%block content%}
    {%endblock content%}
</body>
</html>
